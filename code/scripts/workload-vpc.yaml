workload_vpcs:
  # Workload VPCs in different accounts and regions
  - account_id: "631783514298"
    region: "us-east-1"
    vpc_name: "Workload1-VPC-East"
    cidr_block: "10.0.0.0/16"
    subnets:
      - name: "Workload1-Subnet-East"
        subnet_cidr: "10.0.1.0/24"
        availability_zone: "us-east-1a"
        transit-gateway-attachment:
          - tgw_name: "CC-CentralizedTGW-East"
            attachment_name: "Workload1-TGW-Attachment-East"
        route_table: 
          name: "Workload1-Subnet-East-RT"
          routes:
            - destination_cidr_block: "0.0.0.0/0"
              target: "CC-CentralizedTGW-East"

